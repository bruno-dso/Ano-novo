<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campainha</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main>

        <h1>🔔 Campainha</h1>

        <p id="mensagem">
            Aguardando...
        </p>

        <div id="botoes">

            <button onclick="responder('JA_VOU')">
                Já vou
            </button>

            <button onclick="responder('AGUARDE')">
                Aguarde
            </button>

            <button onclick="responder('NAO_POSSO')">
                Não posso atender
            </button>

        </div>

        <p id="conexao">
            Conectando...
        </p>

    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <script src="script.js"></script>

    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js")
            .then(() => {
                console.log("Service Worker registrado!");
            })
            .catch(error => {
                console.error("Erro:", error);
            });
    }
</script>

</body>

</html>
